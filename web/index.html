<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orðarugl</title>
  <meta name="color-scheme" content="light dark" />
  <script>
    // Resolve the theme before first paint so the page never flashes the wrong one.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("ordarugl-theme"); } catch (e) { /* private mode */ }
      var dark = stored === "dark" ||
        (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <div class="header-text">
        <h1>Orðarugl</h1>
        <p class="tagline">Búðu til þitt eigið íslenska orðarugl og prentaðu út sem PDF.</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"
              aria-label="Skipta yfir í dökkt þema" title="Skipta yfir í dökkt þema">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </header>

    <form id="form" novalidate>
      <label class="field">
        <span class="label">Titill</span>
        <input type="text" id="title" name="title" value="Orðarugl" autocomplete="off" />
      </label>

      <label class="field">
        <span class="label">Orð <span class="muted">(eitt í hverri línu — bil og bandstrik leyfileg)</span></span>
        <textarea id="words" name="words" rows="10" autocomplete="off" spellcheck="false"
                  placeholder="REYKJAVÍK&#10;HRAUN&#10;JÖKULL"></textarea>
        <span id="word-count" class="word-count" aria-live="polite">0 orð</span>
      </label>

      <label class="field">
        <span class="label">Stærð grindar <span class="muted">(valfrjálst — sjálfvirkt ef tómt)</span></span>
        <input type="number" id="size" name="size" min="5" max="30" step="1"
               inputmode="numeric" autocomplete="off" placeholder="sjálfvirkt" />
      </label>

      <fieldset class="field difficulty">
        <legend class="label">Erfiðleiki</legend>
        <label>
          <input type="radio" name="difficulty" value="easy" />
          <span class="difficulty-text">
            <span class="difficulty-name">Auðvelt</span>
            <span class="difficulty-desc">Lárétt og lóðrétt</span>
          </span>
        </label>
        <label>
          <input type="radio" name="difficulty" value="medium" checked />
          <span class="difficulty-text">
            <span class="difficulty-name">Miðlungs</span>
            <span class="difficulty-desc">Líka á ská</span>
          </span>
        </label>
        <label>
          <input type="radio" name="difficulty" value="hard" />
          <span class="difficulty-text">
            <span class="difficulty-name">Erfitt</span>
            <span class="difficulty-desc">Allar áttir, líka aftur á bak</span>
          </span>
        </label>
      </fieldset>

      <div class="actions">
        <button type="submit" id="generate">Búa til</button>
        <button type="button" id="sample" class="secondary">Setja inn dæmi</button>
      </div>
    </form>

    <section id="result" hidden aria-live="polite">
      <h2>Tilbúið</h2>

      <div class="preview">
        <label class="solution-toggle">
          <input type="checkbox" id="show-solution" />
          <span>Sýna lausn</span>
        </label>
        <div class="preview-wrapper" id="preview-wrapper">
          <div class="preview-grid" id="preview-grid">
            <svg class="preview-overlay" id="preview-overlay" aria-hidden="true"></svg>
          </div>
        </div>
      </div>

      <div class="downloads">
        <a id="dl-puzzle" download="ordarugl.pdf" class="button">Sækja orðarugl (PDF)</a>
        <a id="dl-solution" download="ordarugl-lausn.pdf" class="button secondary">Sækja lausn (PDF)</a>
      </div>
      <p id="meta" class="meta"></p>
      <p id="warnings" class="warnings" hidden></p>
    </section>

    <section id="errors" hidden aria-live="assertive" class="errors"></section>

    <footer>
      <p>Orðin þín fara aldrei af tölvunni þinni — PDF er búið til í vafranum.</p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
